<body>
<canvas id="view" role="img" aria-label="A glass tank of water on a tiled floor; light through the moving surface draws caustics on the tank floor"></canvas>

<script type="module">
// =====================================================================================
// CAUSTIC//LITE â€” light through moving water, focused into caustics on a tank floor. Built on
// three.js: a random sea and a rubber duck's ripples (a GPU ripple simulation) move the surface,
// a caustics texture is redrawn every frame, and small shaders follow each ray through the water.
// Without WebGL 2 (or offline, when three.js can't load) a small CPU renderer draws the same scene.
// =====================================================================================

// ---------------------------------------------------------------- the scene (metres)
const VIEW_AREA=1.8;
// The tank is sized to the screen: on a tall phone it is narrow, so the ripple, surface and light grids spend their
// cells on what can be seen instead of on a wide tank that is mostly off screen. A change between portrait and
// landscape reloads the page.
const SCREEN_AR = Math.max(0.35, Math.min(3, innerWidth / Math.max(1, innerHeight)));
// Fish tank (?tank=1): the screen is the tank. Its front glass fills the screen exactly, so the screen's edges are the
// walls the water splashes against. 2 m tall, as wide as the screen's shape, 60 cm deep, with a tiled back wall.
const TANK_MODE = false;   // this page is only the water box
// Water box (?motion=1 without ?tank): seen from above, the screen is the box of water lying on a table. Its water is a shallow-water
// simulation that keeps its volume (see ShallowWater): tip the device any way and the water runs that way, shake it and it sloshes all over.
const SWE_ON = true;
const OUTSIDE = false; // Water box is always the immersive Top view.
const TZ = TANK_MODE ? 0.3 : SWE_ON ? 1.2 : 1.1*VIEW_AREA, TX = TANK_MODE ? SCREEN_AR : SWE_ON ? Math.min(3.2, Math.max(0.55, 1.2 * SCREEN_AR)) : Math.min(1.8*VIEW_AREA, Math.max(1.5, 1.3 * TZ * SCREEN_AR)), TOP = TANK_MODE ? 2.0 : 1.55;   // tank half-width (x), half-depth (z), rim height
addEventListener('resize', () => { if ((innerWidth >= innerHeight) !== (SCREEN_AR >= 1)) location.reload(); });
const LEVEL = TANK_MODE ? 0.45 * TOP : SWE_ON ? 0.7 : 1.2, IOR = 1.333;         // water level, refractive index of water
const ABSORB = TANK_MODE ? [2.4, 0.4, 0.22] : SWE_ON ? [1.5, 0.25, 0.14] : [0.6, 0.1, 0.055];       // absorption per metre: red goes first, so water looks blue-green
const TARGET = [0, 0.55, 0], FOV = 42;

// ---------------------------------------------------------------- the water's own motion (both renderers)
// A random sea: 24 waves from 1.2 m down to 12 cm long, heading every which way (a golden-angle
// spread, so waves of neighbouring lengths never run side by side). Together they make a short-
// crested, random surface, and its caustics form a net of bright cells instead of stripes. Each wave's
// crests wander, and its height rises and falls on its own slow cycle, so the net keeps reshaping.
// Waves scales them all; Turbulence adds the short ones and livens the cycles. On top of that, a
// ripple simulation carries the rubber duck's wake, clicks and gusts across the tank and back off the glass.
const NW = 24, WAVES = [];
{
  let s = 5;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < NW; i++) {
    const len = .62 * 0.1 ** (i / (NW - 1)), k = 2 * Math.PI / len, dir = i * 2.39996 + (rnd() - 0.5) * 0.9;
    WAVES.push({ k, kx: k * Math.cos(dir), kz: k * Math.sin(dir), w: Math.sqrt(9.81 * k + 0.074 * k ** 3), ph: rnd() * 6.283,
      a: 0.32 * Math.min(1, (0.55 / len) ** 2) / (k * k) * (0.6 + 0.8 * rnd()), short: len < 0.3,   // the same curvature (a k^2) for most
      f1: 0.05 + 0.22 * rnd(), f2: 0.09 + 0.3 * rnd(), p1: rnd() * 6.283, p2: rnd() * 6.283 });
  }
}
const waveUniform = new Float32Array(NW * 4), ampUniform = new Float32Array(NW);
WAVES.forEach((W, i) => waveUniform.set([W.kx, W.kz, W.w, W.ph], i * 4));
function waveHeights(t, waves, turb) {   // each wave's height now (m)
  const swing = 0.35 + 0.55 * turb;
  WAVES.forEach((W, i) => { ampUniform[i] = W.a * Math.max(0.1, 1 + swing * (0.6 * Math.sin(W.f1 * t + W.p1) + 0.4 * Math.sin(W.f2 * t + W.p2)))
    * waves * (W.short ? 0.3 + 1.4 * turb : 1); });
}
// the sea at (x, z), as the GPU computes it -> o: height, slope x, slope z, and the water's horizontal velocity
let SWE = null; const swe5 = [0, 0, 0, 0, 0], SWE_PUSH = [0, 0, 9.81];   // ...; the box's eased push on the water (x, z) and how hard it presses on the floor   // the fish tank's shallow water (made below), and a place to read it into
const TILT = [0, 0], TILT_H = TANK_MODE ? 1.0 : 0.45;   // Tilt & play: how far the water leans with the phone (slope in x and z), and the most it can rise or fall (m)
function waveAt(x, z, o) {
  let h = 0, gx = 0, gz = 0, u = 0, v = 0;
  for (let i = 0; i < NW; i++) {   // each wave's crests are bent by a slower wave running along them
    const W = WAVES[i], k = W.k, kb = 0.37 * k, sx = -W.kz / k, sz = W.kx / k;
    const pb = kb * (sx * x + sz * z) + 0.9 * state.t + 7.1 * i, ph = W.kx * x + W.kz * z - W.w * state.t + W.ph + 1.6 * Math.sin(pb);
    const a = ampUniform[i], s = a * Math.sin(ph), cp = a * Math.cos(ph), b = 1.6 * kb * Math.cos(pb);
    h += s; gx += cp * (W.kx + b * sx); gz += cp * (W.kz + b * sz); u += s * W.w * W.kx / k; v += s * W.w * W.kz / k;
  }
  const th = Math.tanh((TILT[0] * x + TILT[1] * z) / TILT_H);
  o[0] = h + TILT_H * th; o[1] = gx + TILT[0] * (1 - th * th); o[2] = gz + TILT[1] * (1 - th * th); o[3] = u; o[4] = v;
  if (SWE) { SWE.at(x, z, swe5); o[0] += swe5[0]; o[1] += swe5[1]; o[2] += swe5[2]; o[3] += swe5[3]; o[4] += swe5[4]; }
}

const $ = (id) => document.getElementById(id);
const state = { t: 0, paused: false, lamp: false, scale: 1, waves: 1, turb: 0.5 };
const drops = [];   // splashes waiting for the ripple simulation: x, z, radius (m), height (mm)
let splashAcc = 0;
function addRipple(x, z, h = 6, r = 0.06) { drops.push([x, z, r, h]); }
function turbulence(dt) {   // gusts ruffle the water here and there, more of them with more turbulence
  for (splashAcc += dt * 5 * state.turb; splashAcc >= 1; splashAcc -= 1)
    addRipple((Math.random() * 2 - 1) * TX * 0.95, (Math.random() * 2 - 1) * TZ * 0.95, (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random()) * state.turb, 0.03 + 0.05 * Math.random());
}

// ---------------------------------------------------------------- the rubber duck
// The sandbox's duck. In duck units (body length 1; x forward, y up, the flat base at the origin),
// ellipsoids and a sphere make the body, tail, chest, head and wings, blended by a smooth minimum so
// they flow into each other; a flattened beak has a mouth line cut in; then two eyes. These are distance
// functions (negative inside): the GPU renderer turns them into a mesh once, the CPU one traces them.
// The duck drifts on a wandering breeze, sways with the waves, bobs and slowly turns; its hull pushes
// the water aside, and the ripple simulation spreads that into a wake and rings (see hull()).
const DS = TANK_MODE ? 0.22 : SWE_ON ? 0.15 : 0.28, DRAFT = 0.125 * DS, FOOT = [0.43 * DS, 0.32 * DS];   // metres per duck unit; how deep it floats; its waterline (half-axes, m)
const ell = (x, y, z, a, b, c) => { x /= a; y /= b; z /= c; const k0 = Math.sqrt(x * x + y * y + z * z), k1 = Math.sqrt(x * x / (a * a) + y * y / (b * b) + z * z / (c * c)); return k0 * (k0 - 1) / k1; };
const smin = (a, b, k) => { const h = Math.min(Math.max(0.5 + 0.5 * (b - a) / k, 0), 1); return b + (a - b) * h - k * h * (1 - h); };
const box = (x, y, z, a, b, c, r) => { const qx = Math.abs(x) - a + r, qy = Math.abs(y) - b + r, qz = Math.abs(z) - c + r, ux = Math.max(qx, 0), uy = Math.max(qy, 0), uz = Math.max(qz, 0);
  return Math.sqrt(ux * ux + uy * uy + uz * uz) + Math.min(Math.max(qx, qy, qz), 0) - r; };
const TIP = [Math.cos(0.55), Math.sin(0.55), Math.cos(0.25), Math.sin(0.25), Math.cos(0.1), -Math.sin(0.1)];   // how the tail, wings and beak are tipped
function duckBody(x, y, z) {   // as duckShape() in the shaders
  const tx = x + 0.4, ty = y - 0.46, wx = x + 0.04, wy = y - 0.37, hx = x - 0.25, hy = y - 0.8;
  let d = ell(x, y - 0.28, z, 0.5, 0.3, 0.37);                                                         // body
  d = smin(d, ell(tx * TIP[0] + ty * TIP[1], ty * TIP[0] - tx * TIP[1], z, 0.2, 0.13, 0.15), 0.12);    // tail
  d = smin(d, ell(x - 0.22, y - 0.3, z, 0.3, 0.26, 0.31), 0.1);                                        // chest
  d = smin(d, Math.sqrt(hx * hx + hy * hy + z * z) - 0.25, 0.14);                                      // head
  d = smin(d, ell(wx * TIP[2] + wy * TIP[3], wy * TIP[2] - wx * TIP[3], Math.abs(z) - 0.29, 0.27, 0.12, 0.08), 0.05);   // wings
  return Math.max(d, box(x, y - 0.6, z, 1.2, 0.58, 1.2, 0.03));                                        // flat base
}
function duckBeak(x, y, z) {
  const bx = x - 0.53, by = y - 0.73;
  return Math.max(ell(bx * TIP[4] + by * TIP[5], by * TIP[4] - bx * TIP[5], z, 0.18, 0.065, 0.14), -box(x - 0.64, y - 0.725, z, 0.12, 0.007, 0.2, 0));
}
const EYE = [0.41, 0.9, 0.15, 0.055];   // eye centre (and its mirror image across z), radius
const pupil = (x, y, z) => Math.hypot(x - 0.44, y - 0.906, Math.abs(z) - 0.172) < 0.032;   // a black disc, looking forward and out
const newDuck = (x, z, head) => ({ on: false, x, z, vx: 0, vz: 0, head, spin: 0, y: 0, vy: 0, pitch: 0, roll: 0, breeze: head, draft: DRAFT });
const DUCK = newDuck(0.55, 0.25, 2.5);   // the first duck; both renderers can draw the whole flock
const MAX_DUCKS=50;
const DUCKS=[DUCK,...Array.from({length:MAX_DUCKS-1},()=>newDuck(0,0,Math.random()*Math.PI*2))];   // up to fifty; DUCKS[i].on says if it is in the water
const PUSH = 420;   // how much of the water the hull moves shows up as ripples (mm per m)
const dw = new Float32Array(5);
const visibleBounds={x:TX-.3,z:TZ-.3};
function constrainDuck(D=DUCK){
  const x=Math.max(-visibleBounds.x,Math.min(visibleBounds.x,D.x)),z=Math.max(-visibleBounds.z,Math.min(visibleBounds.z,D.z));
  if(x!==D.x)D.vx=-D.vx*.3;if(z!==D.z)D.vz=-D.vz*.3;
  D.x=x;D.z=z;
}
function setDuckCount(n){
  n=Math.max(0,Math.min(MAX_DUCKS,Math.floor(n)));    // 0 to 50 ducks; a duck that joins starts somewhere in the open water
  for(let i=0;i<DUCKS.length;i++){const D=DUCKS[i],on=i<n;
    if(on&&!D.on&&i>0){D.x=(Math.random()*2-1)*visibleBounds.x*.8;D.z=(Math.random()*2-1)*visibleBounds.z*.8;D.vx=D.vz=0;D.y=D.vy=0;}
    D.on=on;if(!on){D.falling=false;D.landing=0;}}
  const sel=document.getElementById('duck');if(sel)sel.value=String(n);
  try{localStorage.setItem(TANK_MODE?'water.tankDucks':SWE_ON?'water.boxDucks':'water.lightDucks',String(n));}catch{}
  dispatchEvent(new CustomEvent('water-duck-count',{detail:n}));
}
$('duck').replaceChildren(...Array.from({length:51},(_,i)=>{const o=document.createElement('option');o.value=i;o.textContent=i+' ducks';return o;}));
const duckCount=()=>DUCKS.filter(D=>D.on).length;
function duckRenderY(D){if(!D.falling)return D.y;const surface=D.dropWater||0;return surface+R.airHeight(Math.max(0,D.y-surface));}
function keepAfloat(D){if(!D.surface||!D.on||D.falling||D.landing>0)return;const y=Math.max(DRAFT-LEVEL,D.surface[0]),travel=DRAFT*.35;D.y=Math.max(y-travel,Math.min(y+travel,D.y));D.draft=Math.max(.004,Math.min(DRAFT*2.2,DRAFT+y-D.y));}

const splashDrops=[],splashCrowns=[],splashFluid=new SplashFluid();let impactCount=0;
function dropDuck(){
  const n=duckCount();if(n>=MAX_DUCKS||state.paused)return false;
  setDuckCount(n+1);const D=DUCKS[n];let best=-1,point=[0,0];
  for(let i=0;i<24;i++){const x=(Math.random()*2-1)*visibleBounds.x*.72,z=(Math.random()*2-1)*visibleBounds.z*.72;let gap=10;for(let j=0;j<n;j++)gap=Math.min(gap,Math.hypot(x-DUCKS[j].x,z-DUCKS[j].z));if(gap>best){best=gap;point=[x,z];}}

  const duration=Math.sqrt(2*D.dropHeight/9.81),angle=Math.random()*Math.PI*2;
  D.x=Math.max(-visibleBounds.x*.88,Math.min(visibleBounds.x*.88,point[0]-Math.cos(angle)*(.28+Math.random()*.28)));
  D.z=Math.max(-visibleBounds.z*.88,Math.min(visibleBounds.z*.88,point[1]-Math.sin(angle)*(.28+Math.random()*.28)));

  D.airYaw=(Math.random()-.5)*2.4;D.airPitch=(Math.random()-.5)*Math.PI*2;D.airRoll=(Math.random()-.5)*Math.PI*2;D.airPitchV=(Math.random()-.5)*3;D.airRollV=(Math.random()-.5)*3;
  D.head=Math.atan2(D.vz,D.vx)+(Math.random()-.5)*.8;D.pitch=D.airPitch;D.roll=D.airRoll;
  D.draft=0;D.falling=true;D.landing=0;D.waterY=dw[0];

}
function duckImpact(D,speed){
  impactCount++;addRipple(D.x,D.z,-7,.09);
  const area=SWE.dx*SWE.dz,centerX=Math.floor((D.x+TX)/SWE.dx),centerZ=Math.floor((D.z+TZ)/SWE.dz),cells=[];
  for(let z=-1;z<=1;z++)for(let x=-1;x<=1;x++){const i=Math.max(0,Math.min(SWE.nx-1,centerX+x)),j=Math.max(0,Math.min(SWE.nz-1,centerZ+z));if(!cells.includes(j*SWE.nx+i))cells.push(j*SWE.nx+i);}
  const volume=Math.min(.00035*(DS/.2)**3,...cells.map(k=>SWE.h[k]*area*cells.length*.15));
  for(const k of cells)SWE.h[k]-=volume/(area*cells.length);
  const returnWater=p=>{const i=Math.max(0,Math.min(SWE.nx-1,Math.floor((p.x+TX)/SWE.dx))),j=Math.max(0,Math.min(SWE.nz-1,Math.floor((p.z+TZ)/SWE.dz)));SWE.h[j*SWE.nx+i]+=p.volume/area;};
  returnWater.parcelVolume=volume/144;
  splashFluid.spawn(D.x,LEVEL+D.y,D.z,D.entryVx||0,D.entryVz||0,speed,D.head,returnWater);
  dispatchEvent(new CustomEvent('water-duck-impact',{detail:{x:D.x,z:D.z,speed}}));
}
function stepSplash(dt){splashFluid.step(dt,(x,z)=>{let nearest=null,best=.5;for(const d of DUCKS){if(!d.on||!d.surface)continue;const distance=Math.hypot(x-d.x,z-d.z);if(distance<best){nearest=d;best=distance;}}if(nearest)return LEVEL+nearest.surface[0]+Math.max(-.08,Math.min(.08,nearest.surface[1]*(x-nearest.x)+nearest.surface[2]*(z-nearest.z)));waveAt(x,z,dw);return LEVEL+dw[0];},p=>addRipple(p.x,p.z,.25,.018));splashFluid.changed=splashFluid.mesh();}
function separateDucks(){   // ducks do not float through each other
  const min=0.95*DS;
  for(let i=0;i<DUCKS.length;i++)for(let j=i+1;j<DUCKS.length;j++){
    const a=DUCKS[i],b=DUCKS[j];if(!a.on||!b.on||a.falling||b.falling)continue;
    const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz)||1e-4;if(d>=min)continue;
    const k=(min-d)/2/d;a.x-=dx*k;a.z-=dz*k;b.x+=dx*k;b.z+=dz*k;
    const rv=(b.vx-a.vx)*dx/d+(b.vz-a.vz)*dz/d;if(rv<0){a.vx+=dx/d*rv*.5;a.vz+=dz/d*rv*.5;b.vx-=dx/d*rv*.5;b.vz-=dz/d*rv*.5;}
  }
}
function duckStep(h, turb, D = DUCK) {   // move a duck on by h seconds -> its hull before and after: x, z, heading, depth
  const before = [D.x, D.z, D.head, D.on ? D.draft : 0];
  waveAt(D.x, D.z, dw);
  if(D.falling){
    D.vy-=9.81*h;D.y+=D.vy*h;D.x+=D.vx*h;D.z+=D.vz*h;D.draft=0;
    D.head+=D.airYaw*h;D.roll+=D.airRollV*h;D.pitch+=D.airPitchV*h;
    const water=D.surface?.[0]??dw[0];
    if(D.y<=water){const speed=-D.vy;D.y=water;D.falling=false;D.landing=.95;D.entryTime=0;D.entrySpeed=speed;D.entryY=water;D.entryVx=D.vx;D.entryVz=D.vz;D.vx*=.25;D.vz*=.25;D.vy=-Math.min(1.8,speed*.28);duckImpact(D,speed);}
    return [before,[D.x,D.z,D.head,D.draft]];
  }
  D.landing=Math.max(0,(D.landing||0)-h);
  if(D.landing>0){D.entryTime+=h;}

  D.breeze += (Math.random() - 0.5) * Math.sqrt(h) * (0.6 + 2 * turb);
  const sp = 0.03 + 0.12 * turb, wall = (d) => Math.max(0, 0.5 - d) * 0.8;   // the glass pushes it back
  // in the water box a duck is light: it goes where the water goes, quickly, and slides down the slope of the water toward the deep side
  if (SWE_ON) {   // a duck is light: it is carried along by the water under it, and feels the same push as the water (the box's push, less the slope of the water)
    SWE.at(D.x, D.z, swe5);
    const grip = Math.min(1, 8 * h), [px, pz, g] = SWE_PUSH;

  try { R = await gpuRenderer(canvas); } catch (e) { console.warn('three.js renderer unavailable, using the CPU:', e.message); const note=document.createElement('p');note.textContent='Using the simpler water picture on this device.';document.getElementById('moreSettings')?.append(note); }
if (!R) {   // no WebGL 2 (or three.js could not load): a fresh canvas for the 2D context
  const c2 = canvas.cloneNode(); canvas.replaceWith(c2); canvas = c2;
  R = cpuRenderer(canvas);
}
state.scale = R.name.startsWith('CPU') ? 0.25 : G.ratio;
if (innerWidth < 640) $('ui').open = false;

const units = { elev: '°', az: '°', lampH: ' m', lampX: ' m' };
for (const id of ['elev', 'az', 'lampH', 'lampX', 'waves', 'turb']) {
  const show = () => { const x = +$(id).value; $(id + 'Out').textContent = units[id] ? x + units[id] : x.toFixed(2); };
  $(id).addEventListener('input', show); show();
}
function setLamp(on) {
  state.lamp = on; $('sunCtl').hidden = on; $('lampCtl').hidden = !on;
  $('sun').setAttribute('aria-pressed', !on); $('lamp').setAttribute('aria-pressed', on);
}
$('sun').addEventListener('click', () => setLamp(false)); $('lamp').addEventListener('click', () => setLamp(true));
$('duck').addEventListener('change', (e) => setDuckCount(+e.target.value));
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'range' && e.key !== ' ') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { state.paused = !state.paused; e.preventDefault(); }
  else if (k === 'h') $('ui').hidden = !$('ui').hidden;
  else if (k === 'l') setLamp(!state.lamp);
  else if (k === 'd') setDuckCount(duckCount() === 0 ? 1 : duckCount() === 1 ? 5 : 0);   // none, 1, 5
  else if (k === 'r') addRipple((Math.random() * 2 - 1) * TX * 0.8, (Math.random() * 2 - 1) * TZ * 0.8);
});
window.lite = { dropDuck, splashDrops, splashCrowns, splashFluid, get impacts(){return impactCount;}, state, R, addRipple, poke, setLamp, DUCK, DUCKS, setDuckCount, visibleBounds, SWE };   // for scripted views and tests

// ---------------------------------------------------------------- Tilt & play: the screen is a bottle of water
// motion-water.js sends the phone's gravity reading as 'water-tilt' (m/s^2, in screen terms). The water stays level in
// the world, so on the phone it leans toward the low side. A spring lets it overshoot and slosh back, and quick
// movement throws ripples off the near wall and ruffles the whole surface for a moment.
const KEYS = new Set();   // arrow keys held down
const UNDER = { on: false }; window.lite.UNDER = UNDER;   // the device is upside down: the view is from under the water
addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'f' && !BOTTLE.on && !e.target.matches?.('input,select')) UNDER.on = !UNDER.on; });   // no sensor (a computer): F turns it over
addEventListener('keydown', (e) => { if (e.key.startsWith('Arrow') && !e.target.matches?.('input,select')) { KEYS.add(e.key.toLowerCase()); e.preventDefault(); } });
addEventListener('keyup', (e) => KEYS.delete(e.key.toLowerCase()));
addEventListener('blur', () => KEYS.clear());
const BOTTLE = { on: false, a: [0, 0, 9.81], level: [0, 0, 9.81], last: null, s: [0, 0], v: [0, 0], shake: 0, emit: 0, wave: 0, turb: 0 };
const BOTTLE_SPRING = 40, BOTTLE_DAMP = 2.4, BOTTLE_MAX = TANK_MODE ? 1.6 : 0.8;
window.lite.BOTTLE = BOTTLE;   // for scripted views and tests   // how stiff the sloshing is (about once a second), how fast it dies down, steepest lean
addEventListener('water-tilt', (ev) => {
  const d = ev.detail, B = BOTTLE;
  if (!d || d.off) { B.on = false; B.last = null; return; }
  B.on = true; B.level = d.level || B.level;
  const j = B.last ? Math.hypot(d.x - B.last[0], d.y - B.last[1], d.z - B.last[2]) / 9.81 : 0;   // how hard the phone was jerked, in g
  B.shake = Math.min(2, Math.max(B.shake, j * 1.5));
  B.a = [d.x, d.y, d.z]; B.last = B.a;
});
function bottleStep(dt) {
  const B = BOTTLE;
  let tx = 0, tz = 0;
  if (SWE_ON) {   // the device is the box of water lying under the screen: its own readings push the water (gravity, whichever way it is held, and shaking)
    let ax = 0, az = 0, g = 9.81;
    if (B.on) {
      if (B.a[2] < -3) UNDER.on = true; else if (B.a[2] > -1) UNDER.on = false;   // turned face down (past about 110 degrees) it is seen from under the water; turned back, from above
      ax = -B.a[0]; az = UNDER.on ? -B.a[1] : B.a[1]; g = Math.max(2, UNDER.on ? -B.a[2] : B.a[2]);   // from underneath, the screen's up is the box's +z
      if (Math.abs(ax) < 0.4) ax = 0; if (Math.abs(az) < 0.4) az = 0;
    }   // a hand's small wobble (under about 2 degrees) is ignored
    else {   // the arrows push the way you see them: right is screen right, up is away from you, from wherever the camera stands
      const kx = 3 * (KEYS.has('arrowright') - KEYS.has('arrowleft')), ky = 3 * (KEYS.has('arrowup') - KEYS.has('arrowdown'));   // about 17 degrees
      const yaw = OUTSIDE && R.viewYaw ? R.viewYaw() : 0, c = Math.cos(yaw), sn = Math.sin(yaw);
      ax = kx * c - ky * sn; az = -kx * sn - ky * c;
      if (UNDER.on) { ax = kx; az = ky; }   // seen from underneath: screen up is the box's +z
    }   // no sensor (a computer): the arrow keys tip the box (the water runs the way the arrow points), about 30 degrees   // the push on the water is minus the reading (the screen's up is the box's -z); how hard it presses on the floor is the part of gravity into the screen
    const ease = 1 - Math.exp(-dt / 0.3), P = SWE_PUSH;   // the push eases in over about a third of a second, so the water does not jump at every twitch
    P[0] += (ax - P[0]) * ease; P[1] += (az - P[1]) * ease; P[2] += (g - P[2]) * ease; ax = P[0]; az = P[1]; g = P[2];
    if (B.kick && B.kick.t > 0) { ax += B.kick.a; B.kick.t -= dt; }   // the Splash button's shove (not eased: it is a shove)
    if (!state.paused) SWE.step(dt, Math.max(-30, Math.min(30, ax)), Math.max(-30, Math.min(30, az)), g);
    if (R.setSwe) R.setSwe(SWE);
  } else if (B.on && TANK_MODE) {   // the phone held up is the tank: the water stays level, so it slopes against the tank's own up (screen y)
    const up = Math.max(2, B.a[1]);   // lying flat or upside down, it leans as far as it can
    tx = -B.a[0] / up;   // sideways: the water leans to the low side
    tz = -B.a[2] / up;   // forward and back too: tip the device away and the water runs to the back wall, tip it toward you and it runs to the front glass
    const jolt = B.lastTx === undefined ? 0 : tx - B.lastTx; B.lastTx = tx;
    if (Math.abs(jolt) > 0.05) B.v[0] += jolt * 6;   // a quick shake shoves the whole body of water, not only leans it (small hand wobble is ignored)
  } else if (B.on) {   // where the water wants to lean: the part of gravity along the screen, toward the low side
    const fx = (B.a[0] - B.level[0]) / 9.81, fy = (B.a[1] - B.level[1]) / 9.81, m = Math.hypot(fx, fy), f = Math.min(m, 0.7);
    const k = m > 1e-6 ? f / m / Math.sqrt(1 - f * f) : 0;
    tx = -fx * k; tz = fy * k;   // the screen's up is the tank's -z
  }
  const n = Math.max(1, Math.ceil(dt / 0.008)), h = dt / n;
  for (let i = 0; i < n; i++) for (let a = 0; a < 2; a++) {
    const t = a ? tz : tx;
    B.v[a] += (BOTTLE_SPRING * (t - B.s[a]) - BOTTLE_DAMP * B.v[a]) * h;
    B.s[a] = Math.max(-BOTTLE_MAX, Math.min(BOTTLE_MAX, B.s[a] + B.v[a] * h));
  }
  TILT[0] = B.s[0]; TILT[1] = B.s[1];
  if (R.setTilt) R.setTilt(TILT[0], TILT[1]);
  // sloshing and shaking ruffle the water; it settles again in a second or two
  const speed = Math.hypot(B.v[0], B.v[1]);
  B.shake *= Math.exp(-dt * 1.6);
  const energy = Math.min(1.5, speed * 0.3 + B.shake);
  const calm = TANK_MODE ? 0.7 : .42;   // the fish tank is small, so it gets smaller splashes and fewer of them
  B.wave = Math.min(0.8, energy * 0.7) * calm; B.turb = Math.min(0.7, energy * 0.5) * calm;
  if (state.paused) return;
  for (B.emit += dt * energy * 24 * calm; B.emit >= 1; B.emit -= 1) {   // splashes where the water hits the wall it is moving toward
    let ux = B.v[0], uz = B.v[1], len = Math.hypot(ux, uz);
    if (len < 0.05) { const a = Math.random() * 6.283; ux = Math.cos(a); uz = Math.sin(a); len = 1; }
    ux /= len; uz /= len;
    const edge = Math.min(visibleBounds.x / Math.max(Math.abs(ux), 1e-3), visibleBounds.z / Math.max(Math.abs(uz), 1e-3)) * 0.85, side = (Math.random() - 0.5) * 0.9;
    addRipple(ux * edge - uz * side * visibleBounds.x, uz * edge + ux * side * visibleBounds.z, (4 + energy * 9 * (0.5 + Math.random())) * calm, (0.07 + 0.06 * Math.random()) * (TANK_MODE ? 0.6 : 1));
  }
}
if (new URLSearchParams(location.search).has('motion')) {   // Tilt & play starts calm: the movement comes from the phone
  if (R.setBottle) R.setBottle(true);
  for (const [id, v] of [['waves', 0.18], ['turb', 0.1]]) { const e = $(id); if (e) { e.value = v; e.dispatchEvent(new Event('input', { bubbles: true })); } }
}
if (TANK_MODE || SWE_ON) {   // the fish tank and the water box know which way is down, and in the app the sensor starts by itself
  const ready = (go) => document.readyState === 'complete' ? go() : addEventListener('load', go);   // this script may run after the page has loaded
  ready(() => setTimeout(() => {
    for (const id of ['neutralMotion', 'flatMotion']) document.getElementById(id)?.remove();
    const said = document.getElementById('motionStatus'); if (said) said.textContent = TANK_MODE ? 'Hold the device up: it is the fish tank. Tilt it or shake it.' : 'The device is a box of water: tip it any way, or shake it.';
    if (window.AndroidMotion && !BOTTLE.on) document.getElementById('enableMotion')?.click();
  }, 300));
  // a Splash button: a hard slosh to one side and a splash in the middle, as if the tank was knocked
  const splash = document.createElement('button');
  splash.id = 'tankSplash'; splash.className = 'btn primary'; splash.textContent = 'Splash';
  splash.style.cssText = 'position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;min-width:140px;min-height:48px;font-size:16px;border-radius:24px';
  splash.onclick = () => {dispatchEvent(new Event('water-splash-sound'));
    BOTTLE.shake = Math.max(BOTTLE.shake, 1.2); BOTTLE.v[0] += (Math.random() < 0.5 ? -1 : 1) * 1.4; BOTTLE.kick = { a: (Math.random() < 0.5 ? -1 : 1) * 6, t: 0.14 };
    addRipple((Math.random() - 0.5) * TX, (Math.random() - 0.5) * TZ, 12, 0.065);
  };
  document.body.append(splash);
}

// how many ducks, and (fish tank) whether the tiled background shows; both are remembered
{
  let n = TANK_MODE || SWE_ON ? 1 : 0;
  try { const v = localStorage.getItem(TANK_MODE ? 'water.tankDucks' : SWE_ON ? 'water.boxDucks' : 'water.lightDucks'); if(v!==null&&Number.isInteger(+v)&&+v>=0&&+v<=MAX_DUCKS)n=+v; } catch {}   // none, 1 or 5; anything else saved before starts with 1
  setDuckCount(n);
  if (TANK_MODE) {
    const row = $('tankBgRow'), box = $('tankBg'); row.hidden = false;
    try { box.checked = localStorage.getItem('water.tankBackground') === '1'; } catch {}
    const apply = () => { if (R.setPlain) R.setPlain(!box.checked); try { localStorage.setItem('water.tankBackground', box.checked ? '1' : '0'); } catch {} };
    box.addEventListener('change', apply); apply();
  }
}

$('outsideRow').hidden=true;

if (SWE_ON) {   // how small the floor tiles look (remembered)
  const tiles = $('boxTiles'), tilesOut = $('boxTilesLabel').querySelector('output');
  tiles.hidden = $('boxTilesLabel').hidden = false;
  tiles.value='24';try{if(!localStorage.getItem('water.boxSmallTilesDefault')){localStorage.setItem('water.boxTiles','24');localStorage.setItem('water.boxSmallTilesDefault','1');}tiles.value=localStorage.getItem('water.boxTiles')||'24';}catch{}
  const setTiles = () => { tilesOut.textContent = tiles.value > 17 ? 'small' : tiles.value < 10 ? 'big' : 'medium'; if (R.setTiles) R.setTiles(+tiles.value); try { localStorage.setItem('water.boxTiles', tiles.value); } catch {} };
  tiles.addEventListener('input', setTiles); setTiles();
}
if (SWE_ON) {   // how much water is in the box (remembered)
  const fill = $('tankFill'), fillOut = $('tankFillLabel').querySelector('output');
  fill.hidden = $('tankFillLabel').hidden = false;
  try { fill.value = localStorage.getItem('water.boxFill') || '100'; } catch {}
  const setFill = (reset) => { fillOut.textContent = fill.value + '%'; if (reset) SWE.fill(LEVEL * fill.value / 100); try { localStorage.setItem('water.boxFill', fill.value); } catch {} };
  fill.addEventListener('change', () => setFill(true)); fill.addEventListener('input', () => { fillOut.textContent = fill.value + '%'; }); setFill(true);
}

// render resolution adapts to hold a smooth frame rate: down quickly when slow, up slowly when there is room
let last = performance.now(), frames = 0, elapsed = 0, calmUntil = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000), live = state.paused ? 0 : dt;
  last = now; state.t += live; frames++; elapsed += dt;
  if (elapsed > 0.5) {
    const fps = frames / elapsed;
    if (fps < R.target * 0.9) { state.scale = Math.max(R.minScale, state.scale * 0.85); calmUntil = now + 2500; }
    else if (fps > R.target * 1.12 && now > calmUntil) state.scale = Math.min(R.maxScale, state.scale * 1.08);
    $('stats').textContent = `${R.name} · ${fps.toFixed(0)} fps · ${Math.round(state.scale * 100)}% res`;
    frames = 0; elapsed = 0;
  }
  stepSplash(live);
  bottleStep(live);
  state.waves = +$('waves').value + BOTTLE.wave; state.turb = Math.min(1, +$('turb').value + BOTTLE.turb);
  if (live > 0) turbulence(live);
  waveHeights(state.t, state.waves, state.turb);
  R.draw(live, light());
  dispatchEvent(new Event('water-rendered'));
}
requestAnimationFrame(frame);
